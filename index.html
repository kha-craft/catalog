<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도록 보기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f3ee;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#333;}

  #bar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:12px;background:#fff;border-bottom:1px solid #e5e3da;
  }
  #bar input{
    width:54px;padding:6px 8px;border:1px solid #d8d5c9;border-radius:5px;
    text-align:center;font-size:14px;
  }
  #bar button{
    padding:6px 14px;border:1px solid #d8d5c9;border-radius:5px;background:#fff;
    font-size:14px;cursor:pointer;
  }
  #bar button:hover{background:#f4f3ee;}
  #bar .status{font-size:13px;color:#888;min-width:70px;}

  #pages{display:flex;flex-direction:column;align-items:center;padding:24px 12px 80px;gap:20px;}
  .page{width:100%;max-width:820px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);}
  .page canvas{display:block;width:100%;height:auto;}
  .page .num{text-align:center;font-size:12px;color:#aaa;padding:6px 0 0;}

  #loading{text-align:center;padding:80px 20px;color:#999;font-size:14px;}
</style>
</head>
<body>

<div id="bar">
  <input type="number" id="pageInput" min="1" placeholder="페이지">
  <button id="goBtn">이동</button>
  <span class="status" id="status">불러오는 중</span>
</div>

<div id="loading">불러오는 중...</div>
<div id="pages"></div>

<script>
/* ▼ 실제 PDF 파일명으로 수정하세요 ▼ */
const PDF_URL = "catalog.pdf";
/* ▲ ------------------------------- ▲ */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

const pagesEl = document.getElementById("pages");
const statusEl = document.getElementById("status");
let pdfDoc = null;
let currentVisible = 1;

function renderPage(num, wrap) {
  if (wrap.dataset.rendered === "true") return;
  wrap.dataset.rendered = "true";
  pdfDoc.getPage(num).then((page) => {
    const targetWidth = Math.min(820, window.innerWidth - 24);
    const scale = targetWidth / page.getViewport({ scale: 1 }).width;
    const viewport = page.getViewport({ scale });
    const canvas = wrap.querySelector("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    page.render({ canvasContext: canvas.getContext("2d"), viewport });
  });
}

const renderObserver = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        renderPage(parseInt(entry.target.dataset.num), entry.target);
      }
      if (entry.intersectionRatio > 0.5) {
        currentVisible = parseInt(entry.target.dataset.num);
        statusEl.textContent = currentVisible + " / " + pdfDoc.numPages;
      }
    });
  },
  { rootMargin: "800px 0px 800px 0px", threshold: [0, 0.5] }
);

pdfjsLib.getDocument(PDF_URL).promise.then((pdf) => {
  pdfDoc = pdf;
  document.getElementById("loading").style.display = "none";
  statusEl.textContent = "1 / " + pdf.numPages;

  for (let i = 1; i <= pdf.numPages; i++) {
    const wrap = document.createElement("div");
    wrap.className = "page";
    wrap.id = "page-" + i;
    wrap.dataset.num = i;
    wrap.innerHTML = '<canvas></canvas><div class="num">' + i + "</div>";
    pagesEl.appendChild(wrap);
    renderObserver.observe(wrap);
  }

  const params = new URLSearchParams(location.search);
  const start = parseInt(params.get("page"));
  if (start >= 1 && start <= pdf.numPages) {
    setTimeout(() => {
      document.getElementById("page-" + start).scrollIntoView({ block: "start" });
    }, 150);
  }
}).catch((err) => {
  document.getElementById("loading").textContent =
    "PDF를 불러올 수 없습니다. 파일명(" + PDF_URL + ")을 확인해 주세요.";
  console.error(err);
});

function goToPage() {
  const n = parseInt(document.getElementById("pageInput").value);
  if (!pdfDoc || !n || n < 1 || n > pdfDoc.numPages) return;
  const el = document.getElementById("page-" + n);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.getElementById("goBtn").addEventListener("click", goToPage);
document.getElementById("pageInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") goToPage();
});
</script>

</body>
</html>
